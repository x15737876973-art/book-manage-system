# ==========================================================
# Spring Boot 配置文件
#
# 说明：本文件会被打包进 jar，因此不要放敏感信息。
#       生产环境应通过环境变量覆盖，例如：
#         SPRING_DATASOURCE_PASSWORD=xxx
# ==========================================================

# ---------- 服务器 ----------
server.port=8080

# ---------- 数据源 ----------
# 复用你 Servlet 版项目的 book_manage 库，无需重新建表
spring.datasource.url=jdbc:mysql://localhost:3306/book_manage?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 改成你自己的 MySQL 密码
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池（Spring Boot 默认已集成，这些是显式配置）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# ---------- MyBatis-Plus ----------
# 数据库下划线字段原文自动映射到 Java 驼峰属性：publish_date -> publishDate
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键策略：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除字段（本项目暂不需要，保留注释作说明）
# mybatis-plus.global-config.db-config.logic-delete-field=deleted
# mybatis-plus.global-config.db-config.logic-delete-value=1
# mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ---------- 日志 ----------
# 开发阶段打印 SQL，便于观察 MyBatis-Plus 生成的语句
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 业务包日志级别
logging.level.com.book.admin=debug

# ---------- JSON 序列化 ----------
# 日期统一格式，避免前端拿到的格式不一致
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
# null 字段不返回，减小响应体积
spring.jackson.default-property-inclusion=non_null